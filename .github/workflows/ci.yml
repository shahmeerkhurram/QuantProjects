name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range only. A defect that hits 3.11 or 3.12
        # but neither 3.10 nor 3.13 would have to live in a feature added in one
        # and removed in the other — rare enough that testing the brackets buys
        # nearly all the signal for half the CI minutes and half the noise.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No network access is needed: risk_engine.data falls back to its
      # deterministic synthetic generator, so the suite is fully reproducible.
      - name: Run tests
        run: pytest -q --cov=risk_engine --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          risk-engine --version
          risk-engine option --spot 100 --strike 105 --expiry 1 --vol 0.2
          risk-engine report --tickers SYNTH_A,SYNTH_B,SYNTH_C --confidence 0.99
          risk-engine contagion --tickers SYNTH_A,SYNTH_B,SYNTH_C --threshold 0.2
